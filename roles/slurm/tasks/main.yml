- name: Write slurm.conf (identical on every node)
  ansible.builtin.template:
    src: slurm.conf.j2
    dest: /etc/slurm/slurm.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Restart slurmd
    - Reconfigure slurmctld

- name: Write cgroup.conf
  ansible.builtin.template:
    src: cgroup.conf.j2
    dest: /etc/slurm/cgroup.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart slurmd

- name: Write gres.conf on nodes that declare a GRES (e.g. a GPU)
  ansible.builtin.template:
    src: gres.conf.j2
    dest: /etc/slurm/gres.conf
    owner: root
    group: root
    mode: "0644"
  when: slurm_gres_conf | default([]) | length > 0
  notify: Restart slurmd

- name: Keep slurmd running
  ansible.builtin.service:
    name: slurmd
    state: started
    enabled: true

# Metrics for the node exporter's textfile collector, from the controller:
# every node's state, whether it responds, and since when it is unavailable.
- name: Publish every node's Slurm state, from the controller
  when: inventory_hostname == slurm_controller
  block:
    - name: Write the Slurm metrics script
      ansible.builtin.template:
        src: homelab-slurm-metrics.sh.j2
        dest: /usr/local/sbin/homelab-slurm-metrics
        owner: root
        group: root
        mode: "0755"

    - name: Run it every minute
      ansible.builtin.copy:
        dest: "/etc/systemd/system/homelab-slurm-metrics.{{ item.ext }}"
        content: "{{ item.content }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - ext: service
          content: |
            # Managed by Ansible (slurm role).
            [Unit]
            Description=Publish every node's Slurm state
            After=slurmctld.service

            [Service]
            Type=oneshot
            ExecStart=/usr/local/sbin/homelab-slurm-metrics
        - ext: timer
          content: |
            # Managed by Ansible (slurm role).
            [Unit]
            Description=Slurm node state metrics, every minute

            [Timer]
            OnActiveSec=30s
            OnUnitActiveSec=1min

            [Install]
            WantedBy=timers.target
      loop_control:
        label: "{{ item.ext }}"
      register: slurm_metric_units

    # In check mode the unit files are not written yet, so there is nothing to start.
    - name: Start the Slurm metrics
      ansible.builtin.systemd_service:
        name: homelab-slurm-metrics.timer
        state: started
        enabled: true
        daemon_reload: true
      when: not ansible_check_mode or slurm_metric_units is not changed
