- name: Forward IPv4 packets between interfaces
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present

- name: Drop routed traffic unless a rule allows it
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="DROP"'
  notify: Reload ufw

# NAT lives in its own nftables table (homelab_nat), not in ufw's before.rules:
# ufw re-applies before.rules on every reload without flushing the nat table,
# which stacked one MASQUERADE copy per reload (seven on 2026-11-23). The new
# table goes in first and the old rule comes out after, so the lab never loses
# its NAT.
- name: Keep Ubuntu's nftables service off (its default config flushes every rule)
  ansible.builtin.systemd_service:
    name: nftables
    enabled: false

- name: Make the directory for the lab's nftables table
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the lab's NAT as its own nftables table
  ansible.builtin.template:
    src: homelab-nat.nft.j2
    dest: /etc/nftables.d/homelab-nat.nft
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
  register: router_nat_table
  notify: Reload the lab NAT

- name: Write the service that loads it at boot
  ansible.builtin.template:
    src: homelab-nat.service.j2
    dest: /etc/systemd/system/homelab-nat.service
    owner: root
    group: root
    mode: "0644"
  register: router_nat_unit

# In check mode neither file is written yet, so there is nothing to start.
- name: Load the lab NAT now and at every boot
  ansible.builtin.systemd_service:
    name: homelab-nat
    state: started
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode or (router_nat_table is not changed and router_nat_unit is not changed)

- name: Remove the old NAT from ufw's before.rules (the block this role used to write)
  ansible.builtin.blockinfile:
    path: /etc/ufw/before.rules
    marker: "# {mark} homelab-infra NAT"
    state: absent

- name: Remove the old NAT from ufw's before.rules (the same block written by hand)
  ansible.builtin.replace:
    path: /etc/ufw/before.rules
    regexp: '^\*nat\n:POSTROUTING ACCEPT \[0:0\]\n-A POSTROUTING -o {{ wan_if }} -j MASQUERADE\nCOMMIT\n'
    replace: ''
    backup: true

- name: Read the nat table for copies ufw left behind
  ansible.builtin.command: iptables -t nat -S POSTROUTING
  register: router_old_nat
  changed_when: false
  check_mode: false

- name: Delete those copies (the nftables table masquerades the lab now)
  ansible.builtin.shell: |
    set -e
    while iptables -t nat -C POSTROUTING -o {{ wan_if }} -j MASQUERADE 2>/dev/null; do
      iptables -t nat -D POSTROUTING -o {{ wan_if }} -j MASQUERADE
    done
  when: ("-A POSTROUTING -o " ~ wan_if ~ " -j MASQUERADE") in router_old_nat.stdout_lines
  changed_when: true

# Rule order matters for routed traffic: ufw checks rules top-down, first match wins.
- name: Deny lab -> home network (inserted at the top)
  community.general.ufw:
    rule: deny
    route: true
    interface_in: "{{ lan_if }}"
    interface_out: "{{ wan_if }}"
    to_ip: "{{ home_cidr }}"
    insert: 1
    comment: lab may not reach home LAN 2026-11-21
  when: router_block_home_lan

- name: Except Tailscale's direct paths (UDP from each node's WireGuard port), above the deny
  community.general.ufw:
    rule: allow
    route: true
    interface_in: "{{ lan_if }}"
    interface_out: "{{ wan_if }}"
    from_ip: "{{ lab_cidr }}"
    from_port: "{{ firewall_tailscale_port | default(41641) | string }}"
    to_ip: "{{ home_cidr }}"
    proto: udp
    insert: 1
    comment: tailscale direct paths 2026-11-21
  when: router_block_home_lan

- name: Lab -> internet
  community.general.ufw:
    rule: allow
    route: true
    interface_in: "{{ lan_if }}"
    interface_out: "{{ wan_if }}"

- name: Tailnet -> lab (this host is the Tailscale subnet router for the lab)
  community.general.ufw:
    rule: allow
    route: true
    interface_in: "{{ firewall_tailscale_if | default('tailscale0') }}"
    interface_out: "{{ lan_if }}"

- name: Set dnsmasq options for the lab
  ansible.builtin.lineinfile:
    path: /etc/dnsmasq.conf
    regexp: "^{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - {regexp: 'interface=', line: "interface={{ lan_if }}"}
    - {regexp: 'bind-dynamic', line: bind-dynamic}
    - {regexp: 'no-resolv', line: no-resolv}
  notify: Restart dnsmasq

- name: Set dnsmasq upstream servers
  ansible.builtin.lineinfile:
    path: /etc/dnsmasq.conf
    line: "server={{ item }}"
  loop: "{{ router_dns_upstreams }}"
  notify: Restart dnsmasq

- name: Read what the gateway already publishes on the tailnet
  ansible.builtin.command: tailscale serve status --json
  register: router_serve_status
  changed_when: false
  check_mode: false
  when: router_tailscale_serve | length > 0

- name: Index the published services as port=target
  ansible.builtin.set_fact:
    router_serve_have: "{{ router_serve_have | default([]) + [(item.key | regex_replace('^.*:', '')) ~ '=' ~ (item.value.Handlers['/'].Proxy | default(''))] }}"
  loop: "{{ (router_serve_status.stdout | default('{}', true) | from_json).get('Web', {}) | dict2items }}"
  loop_control:
    label: "{{ item.key | regex_replace('^.*:', '') }}"
  when: router_tailscale_serve | length > 0

- name: Publish lab web services on the tailnet (HTTPS, tailnet only)
  ansible.builtin.command: "tailscale serve --bg --https={{ item.https_port }} {{ item.target }}"
  loop: "{{ router_tailscale_serve }}"
  loop_control:
    label: "{{ item.https_port }}"
  when: ((item.https_port | string) ~ '=' ~ item.target) not in (router_serve_have | default([]))
  changed_when: true
