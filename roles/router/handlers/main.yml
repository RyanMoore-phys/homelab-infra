- name: Reload ufw
  ansible.builtin.command: ufw reload
  changed_when: true

- name: Reload the lab NAT
  ansible.builtin.systemd_service:
    name: homelab-nat
    state: reloaded
  when: not ansible_check_mode

- name: Restart dnsmasq
  ansible.builtin.service:
    name: dnsmasq
    state: restarted
