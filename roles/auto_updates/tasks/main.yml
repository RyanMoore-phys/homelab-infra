- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Turn on daily package lists and unattended security upgrades
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Keep the unattended-upgrades service running
  ansible.builtin.service:
    name: unattended-upgrades
    state: started
    enabled: true

- name: Let unattended-upgrades install updates from the outside repositories too
  ansible.builtin.template:
    src: 51homelab-origins.j2
    dest: /etc/apt/apt.conf.d/51homelab-origins
    owner: root
    group: root
    mode: "0644"
    validate: apt-config -c %s dump

- name: Reboot through Slurm, after running jobs, when an update needs it
  when: auto_updates_reboot == 'slurm_drain'
  block:
    - name: Install the Slurm client (scontrol)
      ansible.builtin.apt:
        name: slurm-client
        state: present

    - name: Write the drained-reboot script
      ansible.builtin.template:
        src: reboot-when-drained.sh.j2
        dest: /usr/local/sbin/reboot-when-drained
        owner: root
        group: root
        mode: "0755"

    - name: Write its systemd service and weekly timer
      ansible.builtin.template:
        src: "reboot-when-drained.{{ item }}.j2"
        dest: "/etc/systemd/system/reboot-when-drained.{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [service, timer]
      register: auto_updates_timer_files

    # In check mode the unit files are not written, so there is nothing to
    # enable yet; the real run reloads systemd and enables the timer.
    - name: Enable the weekly timer
      ansible.builtin.systemd_service:
        name: reboot-when-drained.timer
        state: started
        enabled: true
        daemon_reload: true
      when: not ansible_check_mode or auto_updates_timer_files is not changed

- name: Remove the drained-reboot timer where it is not wanted
  when: auto_updates_reboot != 'slurm_drain'
  block:
    - name: Look for the timer
      ansible.builtin.stat:
        path: /etc/systemd/system/reboot-when-drained.timer
      register: auto_updates_old_timer

    - name: Stop and disable it
      ansible.builtin.systemd_service:
        name: reboot-when-drained.timer
        state: stopped
        enabled: false
      when: auto_updates_old_timer.stat.exists

    - name: Remove its files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/reboot-when-drained.timer
        - /etc/systemd/system/reboot-when-drained.service
        - /usr/local/sbin/reboot-when-drained
      notify: Reload systemd

# Metric for the node exporter's textfile collector: when unattended-upgrades
# last ran (Ubuntu's apt collector covers pending updates and reboots).
- name: Write the patch metrics script
  ansible.builtin.template:
    src: homelab-patch-metrics.sh.j2
    dest: /usr/local/sbin/homelab-patch-metrics
    owner: root
    group: root
    mode: "0755"

- name: Run it hourly
  ansible.builtin.copy:
    dest: "/etc/systemd/system/homelab-patch-metrics.{{ item.ext }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - ext: service
      content: |
        # Managed by Ansible (auto_updates role).
        [Unit]
        Description=Publish when unattended-upgrades last ran

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/homelab-patch-metrics
    - ext: timer
      content: |
        # Managed by Ansible (auto_updates role).
        [Unit]
        Description=Hourly patch metrics

        [Timer]
        OnActiveSec=1min
        OnUnitActiveSec=1h

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.ext }}"
  register: auto_updates_metric_units

# In check mode the unit files are not written yet, so there is nothing to start.
- name: Start the hourly patch metrics
  ansible.builtin.systemd_service:
    name: homelab-patch-metrics.timer
    state: started
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode or auto_updates_metric_units is not changed
