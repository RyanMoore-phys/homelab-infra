# Install once: pipx install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: private-data
        name: no private network data (IPs, tailnet names, keys, emails)
        entry: scripts/check-private-data.sh
        language: script
        pass_filenames: false
      - id: workflow-guard
        name: self-hosted runner only behind workflow_dispatch
        entry: scripts/check-workflows.sh
        language: script
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
