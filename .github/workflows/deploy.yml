# Deploys to the lab from the self-hosted runner.
#  - Only workflow_dispatch: nobody without write access can start it, and a
#    pull request can never reach the runner (scripts/check-workflows.sh
#    enforces this in CI).
#  - Only from main, only by the repository owner, and only after approval in
#    the protected "homelab" environment, which also holds the secrets.
#  - Actions logs of a public repo are public: every address in the inventory
#    is masked, and only the PLAY RECAP is printed. The full log stays on the
#    runner host.
name: deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = dry run, no changes; apply = make changes"
        type: choice
        options: [check, apply]
        default: check
      limit:
        description: "hosts or groups to target (Ansible --limit)"
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: homelab-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: [self-hosted, homelab]
    environment: homelab
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Validate inputs
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          [[ "$LIMIT" =~ ^[A-Za-z0-9_,:!*.-]+$ ]] || { echo "invalid --limit value"; exit 1; }

      - name: Write private files to the runner's temp dir (never printed)
        env:
          INVENTORY_B64: ${{ secrets.HOMELAB_INVENTORY }}
          SSH_KEY: ${{ secrets.HOMELAB_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOMELAB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/homelab"
          mkdir -p "$d"
          printf '%s' "$INVENTORY_B64" | base64 -d > "$d/hosts.yml"
          printf '%s\n' "$SSH_KEY" > "$d/id_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$d/known_hosts"
          # Mask every IP address and tailnet name from the inventory in this public log.
          grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}|[A-Za-z0-9.-]+\.ts\.net' "$d/hosts.yml" | sort -u \
            | while read -r v; do echo "::add-mask::$v"; done || true
          echo "HOMELAB_DIR=$d" >> "$GITHUB_ENV"

      - name: Install pinned Ansible and collections
        run: make setup

      - name: Run the playbook (recap only in this log)
        env:
          MODE: ${{ inputs.mode }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -uo pipefail
          args=(-i "$HOMELAB_DIR/hosts.yml" playbooks/site.yml --limit "$LIMIT"
                --private-key "$HOMELAB_DIR/id_deploy"
                --ssh-common-args "-o UserKnownHostsFile=$HOMELAB_DIR/known_hosts -o StrictHostKeyChecking=yes")
          if [ "$MODE" = check ]; then args+=(--check); fi
          logdir="$HOME/homelab-deploy-logs"; mkdir -p "$logdir"; chmod 700 "$logdir"
          log="$logdir/$(date -u +%Y%m%dT%H%M%SZ)-$MODE.log"
          if .venv/bin/ansible-playbook "${args[@]}" > "$log" 2>&1; then rc=0; else rc=$?; fi
          echo "mode=$MODE exit=$rc (full log is on the runner host only)"
          sed -n '/PLAY RECAP/,$p' "$log"
          exit "$rc"

      - name: Remove private files
        if: always()
        run: rm -rf "$RUNNER_TEMP/homelab"
