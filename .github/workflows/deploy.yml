# Deploys to the lab from the self-hosted runner.
#  - Only workflow_dispatch: nobody without write access can start it
#    (scripts/check-workflows.sh enforces this in CI).
#  - Only from main, only by the repository owner, after approval in the
#    "homelab" environment. The runner enforces the same rule itself with a
#    job-started hook (runner/job-started.sh), which also stops workflows a
#    pull request might add.
#  - Nothing private comes from GitHub: the SSH key, the inventory and
#    known_hosts are mounted read-only into the runner container on node1.
#  - Actions logs of a public repo are public: every address in the inventory
#    is masked, and only the PLAY RECAP is printed. The full log stays on the
#    runner host.
name: deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = dry run, no changes; apply = make changes"
        type: choice
        options: [check, apply]
        default: check
      limit:
        description: "hosts or groups to target (Ansible --limit)"
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: homelab-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: [self-hosted, homelab]
    environment: homelab
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          [[ "$LIMIT" =~ ^[A-Za-z0-9_,:!*.-]+$ ]] || { echo "invalid --limit value"; exit 1; }

      - name: Check the runner's private files (mounted on node1, never printed)
        run: |
          set -euo pipefail
          # Key, inventory and known_hosts are mounted read-only into the runner
          # container (runner/docker-compose.yml). The key is accepted only from
          # node1's lab address.
          d="$HOME/homelab"
          for f in "$HOME/.ssh/homelab_deploy" "$d/hosts.yml" "$d/known_hosts"; do
            test -r "$f" || { echo "missing on the runner: ${f/#$HOME/~}"; exit 1; }
          done
          # Mask every IP address and tailnet name from the inventory in this public log.
          grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}|[A-Za-z0-9.-]+\.ts\.net' "$d/hosts.yml" | sort -u \
            | while read -r v; do echo "::add-mask::$v"; done || true
          echo "HOMELAB_DIR=$d" >> "$GITHUB_ENV"

      # The runner image (shared recipe with another repository's runner) has no
      # Python and no make, and its distro Python is too old for the pinned
      # Ansible: install the repo's Python version into the runner tool cache.
      - name: Python for Ansible
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install pinned Ansible and collections (same steps as `make setup`)
        run: |
          python -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -r requirements-dev.txt
          .venv/bin/ansible-galaxy collection install -r requirements.yml -p .ansible/collections

      - name: Run the playbook (recap only in this log)
        env:
          MODE: ${{ inputs.mode }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -uo pipefail
          args=(-i "$HOMELAB_DIR/hosts.yml" playbooks/site.yml --limit "$LIMIT"
                --private-key "$HOME/.ssh/homelab_deploy"
                # --ssh-EXTRA-args, written with "=": the inventory sets ssh COMMON args
                # (HostKeyAlias) and inventory variables override CLI options, so common
                # args from here would be dropped and host-key checking silently lost
                # (the runner image's own ssh config turns it off). Tested both ways.
                "--ssh-extra-args=-o UserKnownHostsFile=$HOMELAB_DIR/known_hosts -o StrictHostKeyChecking=yes")
          if [ "$MODE" = check ]; then args+=(--check); fi
          # Kept in the runner's work volume, so the logs survive a rebuilt container.
          logdir="$HOME/_work/_homelab-deploy-logs"; mkdir -p "$logdir"; chmod 700 "$logdir"
          log="$logdir/$(date -u +%Y%m%dT%H%M%SZ)-$MODE.log"
          if .venv/bin/ansible-playbook "${args[@]}" > "$log" 2>&1; then rc=0; else rc=$?; fi
          echo "mode=$MODE exit=$rc (full log is on the runner host only)"
          sed -n '/PLAY RECAP/,$p' "$log"
          exit "$rc"
