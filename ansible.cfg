[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Collections are installed inside the repo (make setup), never taken from ~/.ansible
collections_path = .ansible/collections
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
callback_result_format = yaml
# Never print module arguments (they can carry addresses or keys).
display_args_to_stdout = False

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
