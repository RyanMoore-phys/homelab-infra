# Defaults shared by every host. NOTHING here may identify the real lab:
# addresses, interface names, keys and logins live in inventory/hosts.yml,
# which is gitignored (see inventory/hosts.example.yml for its shape).
ssh_hardening_settings:
  PasswordAuthentication: "no"
  KbdInteractiveAuthentication: "no"
  PermitEmptyPasswords: "no"
  X11Forwarding: "no"
  PermitRootLogin: prohibit-password
  MaxAuthTries: 3
